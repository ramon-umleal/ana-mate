<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chuva de Números - ANA-MATE</title>
    <!-- Token de segurança obrigatório para a API -->
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: linear-gradient(to bottom, #0f2027, #203a43, #2c5364); /* Céu noturno */
            color: white;
            font-family: 'Arial', sans-serif;
            user-select: none; /* Evita selecionar texto ao clicar rápido */
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        /* Barra de Status no Topo */
        #hud {
            position: absolute;
            top: 0;
            width: 100%;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            box-sizing: border-box;
            background: rgba(0, 0, 0, 0.4);
            z-index: 10;
            font-size: 1.5em;
            font-weight: bold;
        }
        /* A Pergunta Gigante no Centro Superior */
        #question-box {
            position: absolute;
            top: 80px;
            width: 100%;
            text-align: center;
            font-size: 4em;
            font-weight: bold;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.8);
            z-index: 10;
            color: #FFD700;
        }
        /* As Bolhas com os Números */
        .drop {
            position: absolute;
            width: 80px;
            height: 80px;
            background: radial-gradient(circle at 30% 30%, #4facfe, #00f2fe);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2em;
            font-weight: bold;
            color: white;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5), inset -5px -5px 15px rgba(0,0,0,0.2);
            cursor: pointer;
            transition: transform 0.1s;
            z-index: 5;
        }
        .drop:hover {
            transform: scale(1.1);
        }
        /* Tela de Fim de Jogo */
        #game-over {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.95);
            color: #333;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            z-index: 20;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        #game-over h2 {
            font-size: 2.5em;
            margin-top: 0;
            color: #e74c3c;
        }
        .btn {
            padding: 15px 30px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin-top: 20px;
            margin-right: 10px;
            transition: background 0.3s, transform 0.2s;
        }
        .btn:hover {
            background: #45a049;
            transform: scale(1.05);
        }
        .btn-back {
            background: #6c757d;
        }
        .btn-back:hover {
            background: #5a6268;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="hud">
            <div>Pontos: <span id="score">0</span></div>
            <div>Vidas: <span id="lives">❤️❤️❤️</span></div>
        </div>
        
        <!-- AQUI FICA A PERGUNTA -->
        <div id="question-box">Carregando...</div>

        <!-- Tela de Fim de Jogo -->
        <div id="game-over">
            <h2>Fim de Jogo!</h2>
            <p style="font-size: 1.5em;">Sua pontuação: <strong id="final-score">0</strong></p>
            <p style="font-size: 1.2em; color: #f39c12;">Estrelas ganhas: <strong id="earned-stars">0</strong> ⭐</p>
            <button class="btn" onclick="startGame()">Jogar Novamente</button>
            <a href="{{ url_for('dashboard') }}" class="btn btn-back">Voltar ao Menu</a>
        </div>
    </div>

    <script>
        let score = 0;
        let lives = 3;
        let currentAnswer = 0;
        let drops = [];
        let gameInterval;
        
        // VELOCIDADE INICIAL (0.8 é bem lento e amigável)
        let dropSpeed = 0.8; 

        const questionEl = document.getElementById('question-box');
        const scoreEl = document.getElementById('score');
        const livesEl = document.getElementById('lives');
        const container = document.getElementById('game-container');
        const gameOverScreen = document.getElementById('game-over');
        const finalScoreEl = document.getElementById('final-score');
        const earnedStarsEl = document.getElementById('earned-stars');

        // Gera uma pergunta de matemática (Tabuada ou Soma)
        function generateQuestion() {
            const a = Math.floor(Math.random() * 9) + 1;
            const b = Math.floor(Math.random() * 9) + 1;
            const isMultiplication = Math.random() > 0.4; // 60% chance de ser multiplicação
            
            if (isMultiplication) {
                currentAnswer = a * b;
                questionEl.textContent = `${a} × ${b} = ?`;
            } else {
                currentAnswer = a + b;
                questionEl.textContent = `${a} + ${b} = ?`;
            }

            createDrops();
        }

        // Cria as bolhas caindo
        function createDrops() {
            // Limpa as bolhas antigas
            drops.forEach(d => d.element.remove());
            drops = [];

            const numDrops = 4; // Quantidade de bolhas caindo ao mesmo tempo
            const answers = [currentAnswer];
            
            // Gera respostas erradas aleatórias
            while(answers.length < numDrops) {
                let wrong = currentAnswer + Math.floor(Math.random() * 20) - 10;
                if (wrong !== currentAnswer && wrong > 0 && !answers.includes(wrong)) {
                    answers.push(wrong);
                }
            }
            
            // Embaralha as respostas
            answers.sort(() => Math.random() - 0.5);

            // Divide a tela em colunas para as bolhas não caírem uma em cima da outra
            const sectionWidth = window.innerWidth / numDrops;

            for (let i = 0; i < numDrops; i++) {
                const drop = document.createElement('div');
                drop.className = 'drop';
                drop.textContent = answers[i];
                
                // Posicionamento horizontal
                const leftPos = (i * sectionWidth) + (sectionWidth / 2) - 40; 
                drop.style.left = `${leftPos}px`;
                
                // Posicionamento vertical inicial (escondido acima da tela)
                const yPos = -80 - Math.random() * 150; // Descompasso para não caírem alinhadas
                drop.style.top = `${yPos}px`;
                
                // Evento de clique
                drop.onclick = () => checkAnswer(answers[i], drop);
                
                container.appendChild(drop);
                drops.push({ element: drop, y: yPos, isCorrect: answers[i] === currentAnswer });
            }
        }

        // Verifica se o aluno clicou na bolha certa
        function checkAnswer(answer, dropElement) {
            if (answer === currentAnswer) {
                // ACERTOU!
                score += 10;
                scoreEl.textContent = score;
                dropSpeed += 0.05; // Aumenta a velocidade beeeem devagarinho
                generateQuestion(); // Gera nova pergunta
            } else {
                // ERROU!
                lives--;
                updateLivesDisplay();
                dropElement.style.background = 'radial-gradient(circle at 30% 30%, #ff4b2b, #ff416c)'; // Fica vermelho
                setTimeout(() => dropElement.style.display = 'none', 200);
                
                if (lives <= 0) endGame();
            }
        }

        // Atualiza a posição das bolhas na tela (Motor do Jogo)
        function update() {
            if (lives <= 0) return;

            let correctMissed = false;

            drops.forEach(drop => {
                drop.y += dropSpeed; // Move a bolha para baixo
                drop.element.style.top = `${drop.y}px`;

                // Se a bolha passou do fundo da tela
                if (drop.y > window.innerHeight) {
                    if (drop.isCorrect) {
                        correctMissed = true; // Deixou a resposta certa cair!
                    }
                    drop.element.remove();
                }
            });

            // Remove as bolhas que já saíram da tela do array
            drops = drops.filter(drop => drop.y <= window.innerHeight);

            // Se a bolha certa caiu no chão, perde vida
            if (correctMissed) {
                lives--;
                updateLivesDisplay();
                if (lives <= 0) {
                    endGame();
                } else {
                    generateQuestion(); // Gera nova pergunta para continuar
                }
            }

            // Chama o próximo frame de animação
            gameInterval = requestAnimationFrame(update);
        }

        function updateLivesDisplay() {
            livesEl.textContent = '❤️'.repeat(Math.max(0, lives));
        }

        // Finaliza o jogo e salva a pontuação
        function endGame() {
            cancelAnimationFrame(gameInterval);
            drops.forEach(d => d.element.remove());
            questionEl.textContent = "";
            
            // Calcula estrelas (1 estrela a cada 30 pontos)
            const starsEarned = Math.floor(score / 30);
            
            finalScoreEl.textContent = score;
            earnedStarsEl.textContent = starsEarned;
            gameOverScreen.style.display = 'block';
            
            // Salva as estrelas no banco de dados via API AJAX
            const csrfToken = document.querySelector('meta[name="csrf-token"]').getAttribute('content');
            
            if (starsEarned > 0) {
                fetch('/api/salvar_resultado', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': csrfToken // Envia o token de segurança
                    },
                    body: JSON.stringify({
                        game_type: 'chuva_numeros',
                        stars_earned: starsEarned
                    })
                }).then(res => res.json())
                  .then(data => console.log("Progresso salvo com sucesso!"))
                  .catch(err => console.error("Erro ao salvar progresso:", err));
            }
        }

        // Inicia o jogo
        function startGame() {
            score = 0;
            lives = 3;
            dropSpeed = 0.8; // Reseta a velocidade
            scoreEl.textContent = score;
            updateLivesDisplay();
            gameOverScreen.style.display = 'none';
            generateQuestion();
            update(); // Inicia o motor do jogo
        }

        // Começa automaticamente quando a página carrega
        window.onload = startGame;
    </script>
</body>
</html>
