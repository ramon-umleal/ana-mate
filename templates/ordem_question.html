<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Desafio Ordem - {{ nivel }}</title>
    <style>
        body { font-family: 'Comic Sans MS', cursive; background: linear-gradient(#87CEEB, #4682B4); text-align:center; padding:20px; }
        .pergunta { font-size: 40px; margin: 40px; color: #00008B; font-weight: bold; }
        input { font-size: 36px; width: 180px; text-align:center; padding:12px; }
        .progresso { height: 25px; background: #32CD32; width: {{ progresso }}%; margin: 30px auto; border-radius: 12px; }
    </style>
</head>
<body>
    <h1>Nível {{ nivel }} 🧠</h1>
    <div class="progresso"></div>
    <p style="font-size:24px;">Pergunta {{ indice }}/10</p>
    
    <div class="pergunta">
        {{ questao.expressao }} =
    </div>
    
    <form method="POST">
        <input type="number" name="resposta" required autofocus>
        <br><br>
        <button type="submit" style="font-size:28px; padding:15px 50px; background:#FF4500; color:white; border:none; border-radius:15px;">
            Responder ✅
        </button>
    </form>
    
    <p>Pontuação total: <strong>{{ total_score }}</strong> ⭐</p>
</body>
</html>
